# Lumedia — Nginx site config for Amazon Linux 2023 / EC2
# Preferred copy lives at: nginx/lumediaads.conf
# Install either file to: /etc/nginx/conf.d/lumediaads.conf
#
# TLS: run Certbot after DNS is live. Do not invent certificate paths here.
#   sudo certbot --nginx -d lumediaads.com -d www.lumediaads.com

server {
    listen 80;
    listen [::]:80;
    server_name lumediaads.com www.lumediaads.com;

    root /var/www/lumediaads.com;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/lumediaads.access.log;
    error_log  /var/log/nginx/lumediaads.error.log;
}
