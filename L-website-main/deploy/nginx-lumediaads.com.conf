# Lumedia — Nginx site config for Amazon Linux 2023 / EC2
# Domain: lumediaads.com (+ www)
# Document root: /var/www/lumediaads.com
#
# Install:
#   sudo cp deploy/nginx-lumediaads.com.conf /etc/nginx/conf.d/lumediaads.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: enable the HTTPS server block after Certbot issues certificates.
#   sudo certbot --nginx -d lumediaads.com -d www.lumediaads.com

server {
    listen 80;
    listen [::]:80;
    server_name lumediaads.com www.lumediaads.com;

    # After Certbot, prefer redirecting HTTP → HTTPS:
    # return 301 https://lumediaads.com$request_uri;

    root /var/www/lumediaads.com;
    index index.html;

    # Security headers (TLS headers added in HTTPS block)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Exact files and directories as in the static site (.html URLs)
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Cache static assets
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Deny hidden / backup files
    location ~ /\. {
        deny all;
    }
}

