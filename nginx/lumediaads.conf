# Lumedia — Nginx server block (HTTP first)
#
# Domains: lumediaads.com, www.lumediaads.com
# Document root: /var/www/lumediaads.com
#
# Install:
#   sudo cp nginx/lumediaads.conf /etc/nginx/conf.d/lumediaads.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# After DNS points here, enable HTTPS with Certbot:
#   sudo certbot --nginx -d lumediaads.com -d www.lumediaads.com
# Certbot will add listen 443 ssl and real certificate paths.
# Do not invent certificate paths in this file before Certbot runs.

server {
    listen 80;
    listen [::]:80;
    server_name lumediaads.com www.lumediaads.com;

    root /var/www/lumediaads.com;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Keep existing .html URLs — no clean-URL rewriting
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/lumediaads.access.log;
    error_log  /var/log/nginx/lumediaads.error.log;
}
